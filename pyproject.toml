[project]
name = "llamastack-functional-tests"
version = "0.1.0"
description = "Functional tests for LlamaStack (Bruno + notebooks)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-stack-client>=0.2.22",
    "openai>=2.24.0",
    "mcp>=1.0.0",
    "pytest>=9.0.2",
    "nbformat>=5.10.4",
    "nbconvert>=7.17.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "ipykernel>=6.29.0",
]

[tool.pytest.ini_options]
addopts = "--junitxml=reports/notebooks.xml"

[tool.ruff]
extend-exclude = ["bruno/"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
